no_ci: true
commands:
  prepare: 'npm ci --prefer-offline --ignore-scripts && for p in skills/*/package.json; do npm ci --omit=dev --prefix "$(dirname "$p")"; done'
  test: 'node scripts/gate-test.mjs'
  lint: 'npm run check'
document:
  instructions: |
    docs/design.md owns the first-release requirements. docs/implementation-plan.md owns the build sequence
    and evidence; each task's evidence contract decides what a change must record.
    README.md owns installation and current usage. skills/*/SKILL.md owns each skill's agent-facing contract.
    Never run the test command again just to attach or refresh evidence, and never start another pipeline for it.
review:
  ignore_patterns: ["upstream/**"]
  path_instructions:
    - path: "**"
      instructions: |
        Review focus for this build: does the change work as its plan task specifies, and is it well designed? Raise functional bugs, broken or missing flows, wrong results, crashes, hangs, data loss, regressions, unhandled errors that break a flow, missing tests for the slice's behaviour, and style, simplification and design-principle issues. Security hardening and threat-model concerns are deferred until the full app is built: do not raise them unless they cause a functional bug.
        Tests must exercise behaviour through the public command, installer or evaluation interface and take expected results from the design, plan or acceptance case. Flag tests that import private helpers to assert internals or that only restate current implementation output.
        Repair each reported invariant across all sibling cases and shared call sites in the same round.
        Enumerate the relevant boundary and failure cases, fix their shared cause, and verify through the public interface.
        Before focused repair verification, install dependencies with npm ci --ignore-scripts and
        npm ci --omit=dev --prefix skills/repo-audit. Review the whole diff again after repairs;
        do not limit valid findings or omit style, simplification or design-principle review.
    - path: "skills/**"
      instructions: |
        Skills stay language-agnostic and dependency-light. Never commit credentials, tokens or customer data.
        Pinned upstream sources and NOTICE attributions must match what the skill actually uses.
auto_fix:
  review: 2
  test: 2
  lint: 0
